services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - npm_config_legacy_peer_deps=true
      - BACKEND_PROXY_TARGET=http://host.docker.internal:8081

    volumes:
      - ./:/app
      # Prevent host node_modules from overriding container deps
      - /app/node_modules
    # CRA needs to see file changes in mounted source
    stdin_open: true
    tty: true

