name: tigers-team

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tigers_team}
      MYSQL_USER: ${MYSQL_USER:-mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_mysql_pw}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  migrations:
    build: ./TigersTeamPython
    env_file: ./TigersTeamPython/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_mysql_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tigers_team}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./TigersTeamPython
    env_file: ./TigersTeamPython/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_mysql_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tigers_team}
      BACKEND_APIs: ${BACKEND_APIs:-/static}
      ENV: ${ENV:-Production}
      API_ROOT_PATH: /api
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-smtp}
      MAIL_OUTBOX: /app/logs/outbox
      SECRET_KEY: ${SECRET_KEY:?Set a unique SECRET_KEY in the root .env}
      SRS_INGEST_URL: ${SRS_INGEST_URL:-rtmp://localhost/live}
      SRS_STREAM_KEY: ${SRS_STREAM_KEY:-OBS_Stream}
      SRS_PUBLISH_TOKEN: ${SRS_PUBLISH_TOKEN:-}
    volumes:
      - api_logs:/app/logs
      - uploads:/app/uploads
      - static_data:/app/static
    depends_on:
      migrations:
        condition: service_completed_successfully
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./TigersTeamReact
    expose: ["80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  srs:
    image: ossrs/srs:5
    command: ./objs/srs -c /usr/local/srs/conf/tigers.conf
    volumes:
      - ./ops/srs/tigers.conf:/usr/local/srs/conf/tigers.conf:ro
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${RTMP_PORT:-1935}:1935"
      - "${BIND_ADDRESS:-0.0.0.0}:${WEBRTC_PORT:-8000}:8000/udp"
    expose: ["8080", "1985"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/local/srs/objs/srs.pid"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    profiles: ["ssl"]

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      srs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  db_data:
  api_logs:
  uploads:
  static_data:
  certbot_etc:
  certbot_webroot:
