resolver 127.0.0.11 valid=10s ipv6=off;
log_format redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log redacted;

upstream frontend { zone frontend 64k; server frontend:80 resolve; }
upstream api { zone api 64k; server api:80 resolve; }
upstream srs_http { zone srs_http 64k; server srs:8080 resolve; }
upstream srs_api { zone srs_api 64k; server srs:1985 resolve; }

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location = /health { return 200 'ok\n'; add_header Content-Type text/plain; access_log off; }
    location = /api/updates { proxy_pass http://api/updates; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_buffering off; proxy_cache off; proxy_read_timeout 60s; }
    location /api/ { proxy_pass http://api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
    location ~ ^/static/(?:js|css|media)/ { proxy_pass http://frontend; proxy_set_header Host $host; }
    location /static/ { proxy_pass http://api/static/; proxy_set_header Host $host; }
    location /hls/ { rewrite ^/hls/(.*)$ /$1 break; proxy_pass http://srs_http; proxy_set_header Host srs; add_header Cache-Control no-cache always; add_header Access-Control-Allow-Origin * always; }
    location ~ ^/live/.*\.(?:m3u8|ts)$ { proxy_pass http://srs_http; proxy_set_header Host srs; add_header Cache-Control no-cache always; add_header Access-Control-Allow-Origin * always; }
    location /rtc/v1/whep/ { proxy_pass http://srs_api; proxy_set_header Host srs; proxy_set_header X-Forwarded-Proto https; }
    location /srs-api/ { return 404; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
