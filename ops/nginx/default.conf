upstream frontend { server frontend:80; }
upstream api { server api:80; }
upstream srs_http { server srs:8080; }
upstream srs_api { server srs:1985; }

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /health { return 200 'ok\n'; add_header Content-Type text/plain; access_log off; }
    location /api/ { proxy_pass http://api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
    location ~ ^/static/(?:js|css|media)/ { proxy_pass http://frontend; proxy_set_header Host $host; }
    location /static/ { proxy_pass http://api/static/; proxy_set_header Host $host; }
    location /hls/ { rewrite ^/hls/(.*)$ /$1 break; proxy_pass http://srs_http; proxy_set_header Host srs; add_header Cache-Control no-cache always; add_header Access-Control-Allow-Origin * always; }
    location ~ ^/live/.*\.(?:m3u8|ts)$ { proxy_pass http://srs_http; proxy_set_header Host srs; add_header Cache-Control no-cache always; add_header Access-Control-Allow-Origin * always; }
    location /rtc/ { proxy_pass http://srs_api; proxy_set_header Host srs; proxy_set_header X-Forwarded-Proto $scheme; }
    location /srs-api/ { proxy_pass http://srs_api/; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host srs; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
