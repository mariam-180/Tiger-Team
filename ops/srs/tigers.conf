listen              1935;
max_connections     1000;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       *;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled on;
        on_publish http://api/stream/on-publish;
    }
    hls { enabled on; hls_fragment 1; hls_window 6; }
    rtc { enabled on; }
}
